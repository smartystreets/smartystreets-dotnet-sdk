name: Publish NuGet Package

on:
  push:
    tags:
      - '**'

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # enable GitHub OIDC token issuance for this job
      contents: read   # job-level permissions drop the defaults; checkout still needs this
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      # Exchange this job's OIDC token for a NuGet API key that expires in 1 hour
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish
        run: NUGET_KEY=${{ steps.login.outputs.NUGET_API_KEY }} VERSION=${GITHUB_REF#refs/tags/} make release
